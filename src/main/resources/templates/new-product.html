<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout1">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
</head>
<body>
<div class="p-3" layout:fragment="content">
    <form method="post" th:action="@{/admin/saveProduct}" th:object="${product}">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" th:field="*{name}">
            <span class="text-danger" th:errors="*{name}"></span>
        </div>

        <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="text" class="form-control" th:field="*{price}">
            <span class="text-danger" th:errors="*{price}"></span>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input type="text" class="form-control" th:field="*{quantity}">
            <span class="text-danger" th:errors="*{quantity}"></span>
        </div>

        <button class="btn btn-primary" type="submit">Save</button>
    </form>
</div>
</body>
</html>
